name: Bug report
description: Report a problem with Shadow Monarch, including mod conflicts.
body:
  - type: input
    id: game-build
    attributes:
      label: Witcher 3 version
      placeholder: "Example: Remastered 5.01c (5.0.0.1090142)"
    validations:
      required: true
  - type: input
    id: shadow-monarch-version
    attributes:
      label: Shadow Monarch version
      placeholder: "Example: 1.0.0-rc1"
    validations:
      required: true
  - type: input
    id: trophy-necromancy-version
    attributes:
      label: Trophy Necromancy version
      placeholder: "Example: 5.01.01"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Installation and other mods
      description: How did you install both mods? List other enabled mods and any script merges, or say if there are none.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the location, army settings, equipped trophy, and book status if relevant.
      placeholder: |
        1. Load a save in ...
        2. Equip ...
        3. Enter combat with ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include how often it happens and any exact error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach relevant logs or screenshots if available. Remove personal information before posting.
